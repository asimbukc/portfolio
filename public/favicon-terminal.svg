<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#termBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Terminal top dots -->
  <circle cx="12" cy="12" r="2" fill="#ef4444" opacity="0.8" />
  <circle cx="18" cy="12" r="2" fill="#eab308" opacity="0.8" />
  <circle cx="24" cy="12" r="2" fill="#22c55e" opacity="0.8" />

  <!-- Terminal Prompt '>' -->
  <path d="M 12 28 L 22 36 L 12 44" fill="none" stroke="url(#termGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram text 'AK' -->
  <text x="26" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="21" fill="#f8fafc" letter-spacing="-0.5">AK</text>

  <!-- Glowing Blinking Cursor '_' -->
  <rect x="52" y="40" width="4" height="4" fill="#38bdf8" rx="1" />
</svg>
