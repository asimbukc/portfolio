<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="akGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle with Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  
  <!-- Subtle inner glow element -->
  <circle cx="32" cy="32" r="20" fill="url(#akGrad)" opacity="0.12" filter="blur(6px)" />

  <!-- AK Stylized Monogram -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M 23 46 L 27.5 46 L 22 18 L 15 18 L 9.5 46 L 14 46 L 15.5 38 L 21.5 38 Z M 16.5 33 L 18.5 23 L 20.5 33 Z" fill="url(#akGrad)" />
    <!-- Letter K connected -->
    <path d="M 28 18 L 33 18 L 33 29.5 L 42 18 L 48.5 18 L 38 31 L 49 46 L 42.5 46 L 33 33 L 33 46 L 28 46 Z" fill="url(#akGrad)" />
  </g>
  
  <!-- Modern accent dot -->
  <circle cx="53" cy="44" r="2.5" fill="#ec4899" />
</svg>
