<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="screenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Laptop Display Lid / Shell (Large & Prominent) -->
  <rect x="7" y="6" width="50" height="38" rx="5" fill="url(#laptopBody)" stroke="#475569" stroke-width="1.5" />

  <!-- Inner Screen Display -->
  <rect x="10" y="9" width="44" height="32" rx="3" fill="url(#screenGrad)" />

  <!-- Code Graphic / Display Content (Brackets & Prompt) -->
  <g filter="url(#screenGlow)">
    <!-- Code Bracket '<' -->
    <path d="M 21 19 L 14 25 L 21 31" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Slash '/' -->
    <path d="M 34 17 L 30 33" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <!-- Code Bracket '>' -->
    <path d="M 43 19 L 50 25 L 43 31" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Laptop Hinge -->
  <path d="M 26 44 L 38 44 L 37 46 L 27 46 Z" fill="#1e293b" />

  <!-- Laptop Keyboard Base (Wide & Sleek) -->
  <path d="M 3 46 C 3 45.5 3.5 45 4 45 L 60 45 C 60.5 45 61 45.5 61 46 L 63 54 C 63 56 61.5 57 59.5 57 L 4.5 57 C 2.5 57 1 56 1 54 Z" fill="url(#baseGrad)" stroke="#334155" stroke-width="1" />

  <!-- Trackpad / Front Lip Notch -->
  <rect x="25" y="47" width="14" height="2" rx="1" fill="#0f172a" opacity="0.8" />
</svg>
