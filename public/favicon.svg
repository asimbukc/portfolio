<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121217" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b56" />
      <stop offset="50%" stop-color="#ef233c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="redBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b56" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.3" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ef233c" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgDark)" stroke="url(#redBorder)" stroke-width="2" />

  <!-- Subtle Radial Red Glow in Center -->
  <circle cx="32" cy="32" r="18" fill="#ef233c" opacity="0.15" />

  <!-- Bold, Clean Letter 'A' in Red Gradient -->
  <path d="M 32 12 L 15 50 L 23.5 50 L 27.5 40 L 36.5 40 L 40.5 50 L 49 50 Z M 29.8 34 L 32 23.2 L 34.2 34 Z" 
        fill="url(#redGrad)" 
        filter="url(#redGlow)" />
</svg>
